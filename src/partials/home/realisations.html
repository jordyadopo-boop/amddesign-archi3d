<section class="scene" id="realisations" data-cam="expo" data-module="gallery" aria-labelledby="real-title">
  <div class="container scene__inner">
    <div class="panel panel--full">
      <p class="panel__tag">R+7 · Salle d'exposition</p>
      <h2 id="real-title" data-split>Nos <span class="gold">réalisations</span></h2>
      <div class="filters" data-filters role="group" aria-label="Filtrer les réalisations"></div>
      <div class="gallery" data-grid></div>
    </div>
  </div>
  <dialog class="lightbox" data-lightbox aria-label="Réalisation">
    <button type="button" class="lightbox__close" data-close aria-label="Fermer">×</button>
    <button type="button" class="lightbox__nav lightbox__nav--prev" data-prev aria-label="Précédente">‹</button>
    <figure><img src="" alt=""><figcaption></figcaption></figure>
    <button type="button" class="lightbox__nav lightbox__nav--next" data-next aria-label="Suivante">›</button>
  </dialog>
</section>
